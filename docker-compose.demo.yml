# Single-container public demo (video campaign): app + Reverb + queue (+scheduler)
# in ONE container, SQLite on a volume, single public $PORT.
# Local run:
#   cp .env.demo.example .env.demo   # fill APP_KEY, APP_URL/PUBLIC_URL, demo passwords
#   docker compose -f docker-compose.demo.yml --env-file .env.demo up -d --build
#
# Koyeb does not use this file (see docs/DEMO.md), but it mirrors the same env.

services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_REVERB_USE_PROXY: "true"
        VITE_REVERB_SCHEME: https
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-pcrxnxletfeemtelvhyn}
        VITE_DEMO_TENANT: ${DEMO_TENANT_SLUG:-lido-azzurra}
        VITE_DEMO_LOCATION: ${DEMO_QR_FIRST_CODE:-umbrella01}
    image: servio-demo:latest
    container_name: servio-demo
    restart: unless-stopped
    ports:
      - "${DEMO_HOST_PORT:-8080}:${PORT:-80}"
    env_file:
      - ${ENV_FILE:-.env.demo}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      PORT: ${PORT:-80}
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/demo.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 6001
      REVERB_SCHEME: http
      # Tiny host: drop the scheduler process (per-minute jobs are also gated
      # in routes/console.php while DEMO_MODE=true).
      SCHEDULER_ENABLED: "false"
      # Safe demo defaults (also set these on Koyeb — see docs/DEMO.md).
      DEMO_MODE: "true"
      DEMO_SEED: ${DEMO_SEED:-true}
      MAIL_MAILER: log
      MAIL_LOG_CHANNEL: stderr
      BACKUP_ENABLED: "false"
      POS_FORCE_STUB: "true"
      MONITORING_FRONTEND_CHECK: "false"
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "false"
    volumes:
      - servio_demo_data:/data
      - servio_demo_storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-80}/up || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  servio_demo_data:
  servio_demo_storage:

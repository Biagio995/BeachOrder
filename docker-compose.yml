services:
  postgres:
    image: postgres:16-alpine
    container_name: beachorder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: beachorder
      POSTGRES_USER: beachorder
      POSTGRES_PASSWORD: beachorder
    ports:
      - "5432:5432"
    volumes:
      - beachorder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beachorder -d beachorder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: beachorder-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: beachorder-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: beachorder
      MINIO_ROOT_PASSWORD: beachorder123
    ports:
      - "9000:9000"
      - "9011:9001"
    volumes:
      - beachorder_minio:/data

volumes:
  beachorder_pgdata:
  beachorder_minio:

# Enabled when PMA_PASSWORD is set (see entrypoint.sh).
# Adminer UI at https://your-domain/pma/

location = /pma {
    return 301 /pma/;
}

location ^~ /pma/ {
    auth_basic "Seatqui database";
    auth_basic_user_file /etc/nginx/.pma_htpasswd;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/pma/index.php;
    fastcgi_param SCRIPT_NAME /pma/index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/pma;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_read_timeout 300s;
}

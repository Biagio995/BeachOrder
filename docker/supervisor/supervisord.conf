[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Optional on tiny hosts: set DEMO_QUEUE_WORKER=false (and QUEUE_CONNECTION=sync)
# to drop this process and free ~50–80 MB RAM.
[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=1 --timeout=90 --memory=96 --max-time=3600
directory=/var/www/html
user=www-data
autostart=%(ENV_QUEUE_WORKER_AUTOSTART)s
autorestart=true
priority=30
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Reverb listens only on loopback; nginx proxies /app + /apps with WS upgrade.
[program:reverb]
command=php /var/www/html/artisan reverb:start --host=127.0.0.1 --port=%(ENV_REVERB_SERVER_PORT)s
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

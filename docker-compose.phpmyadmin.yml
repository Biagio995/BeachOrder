# phpMyAdmin against the local MySQL already running on the host (port 3306).
# Does NOT start a MySQL container — use this when Docker Desktop is up but MySQL is installed on Windows.
#
#   docker compose -f docker-compose.phpmyadmin.yml up -d
#   open http://127.0.0.1:8081
#
# Login: root / root  (or servio / servio)

services:
  phpmyadmin:
    image: phpmyadmin:5
    container_name: servio-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

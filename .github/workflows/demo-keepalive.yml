# Keep the Koyeb Free demo awake (it sleeps after ~1h without traffic).
# Set the repository variable DEMO_URL to the public demo URL
# (repo Settings → Secrets and variables → Actions → Variables).
# If DEMO_URL is not set, the job succeeds immediately without pinging.

name: Demo keep-alive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping public health endpoint
        run: |
          if [ -z "${{ vars.DEMO_URL }}" ]; then
            echo "vars.DEMO_URL is not set — skipping keep-alive ping."
            exit 0
          fi
          BASE="${{ vars.DEMO_URL }}"
          BASE="${BASE%/}"
          curl -fsS --max-time 30 "${BASE}/up" > /dev/null
          echo "Demo is awake (${BASE}/up)."

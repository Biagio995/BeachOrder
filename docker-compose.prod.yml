# Production-like stack: app image + MySQL + Redis (+ optional phpMyAdmin)
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Provide env via a file:
#   cp .env.production.example .env.production

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_REVERB_USE_PROXY: "true"
        VITE_REVERB_SCHEME: https
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-pcrxnxletfeemtelvhyn}
    image: servio-app:latest
    container_name: servio-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      PORT: 80
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-servio}
      DB_USERNAME: ${MYSQL_USER:-servio}
      DB_PASSWORD: ${MYSQL_PASSWORD:-servio}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SERVER_HOST: 127.0.0.1
      REVERB_SERVER_PORT: 8080
      REVERB_SCHEME: http
      DEMO_QUEUE_WORKER: ${DEMO_QUEUE_WORKER:-true}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-false}
    volumes:
      - servio_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: servio-db-prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-servio}
      MYSQL_USER: ${MYSQL_USER:-servio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-servio}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - servio_mysqldata_prod:/var/lib/mysql
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: servio-phpmyadmin-prod
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: servio-redis-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  servio_mysqldata_prod:
  servio_storage:

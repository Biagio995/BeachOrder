# Production-like stack: app image + Postgres + Redis
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Provide env via a file (copy from backend/.env.example and set production values):
#   cp backend/.env.example .env.production

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_REVERB_USE_PROXY: "true"
        VITE_REVERB_SCHEME: https
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-pcrxnxletfeemtelvhyn}
    image: servio-app:latest
    container_name: servio-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      PORT: 80
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-servio}
      DB_USERNAME: ${POSTGRES_USER:-servio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-servio}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SERVER_HOST: 127.0.0.1
      REVERB_SERVER_PORT: 8080
      REVERB_SCHEME: http
      DEMO_QUEUE_WORKER: ${DEMO_QUEUE_WORKER:-true}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-false}
    volumes:
      - servio_storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: servio-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servio}
      POSTGRES_USER: ${POSTGRES_USER:-servio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servio}
    volumes:
      - servio_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servio} -d ${POSTGRES_DB:-servio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: servio-redis-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  servio_pgdata_prod:
  servio_storage:
